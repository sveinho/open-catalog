<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OKF Kunnskapsgraf Browser</title>
    <!-- Markdown-it for rendering -->
    <script src="https://cloudflare.com"></script>
    <!-- Vis.js Network for graf-visualisering -->
    <script type="text/javascript" src="https://unpkg.com"></script>
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; background: #f3f4f6; color: #1f2937; }
        header { background: #fff; padding: 1rem 2rem; border-bottom: 1px solid #e5e7eb; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        h1 { margin: 0; font-size: 1.5rem; }
        .layout { display: flex; flex: 1; overflow: hidden; }
        
        /* Venstre side: Den visuelle grafen */
        #network-container { flex: 1; height: 100%; background: #ffffff; position: relative; }
        
        /* Høyre side: Markdown-dokumentet og metadata */
        #doc-panel { width: 450px; background: #fff; border-left: 1px solid #e5e7eb; padding: 2rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1.5rem; box-shadow: -2px 0 5px rgba(0,0,0,0.02); }
        
        .meta-section { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
        .meta-badge { padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
        .type { background: #e0f2fe; color: #0369a1; }
        .status { background: #dcfce7; color: #15803d; }
        .tier { background: #fef3c7; color: #b45309; }
        
        pre { background: #f4f4f4; padding: 1rem; border-radius: 4px; overflow-x: auto; }
        a { color: #2563eb; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <h1>📚 OKF Graf Navigator <span style="font-weight: normal; font-size: 1rem; color: #6b7280;">— Aktiv sti: <span id="current-path">index.md</span></span></h1>
    </header>

    <div class="layout">
        <!-- Vis.js tegner nettverket her -->
        <div id="network-container"></div>

        <!-- Visning av dokumentet -->
        <div id="doc-panel">
            <div id="metadata-target"></div>
            <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 0;">
            <main id="content-target">Velg en node i grafen eller start fra index.md...</main>
        </div>
    </div>

    <script>
        const md = window.markdownit({ html: true, linkify: true });
        
        // Globale datasett for Vis.js slik at vi kan oppdatere dem dynamisk
        const nodes = new vis.DataSet([]);
        const edges = new vis.DataSet([]);
        let networkInstance = null;

        // Fargekart basert på OKF "type" metadata for å gjøre grafen lettlest
        const typeColors = {
            bundle: '#f43f5e',   // Rosa/Rød
            metric: '#3b82f6',   // Blå
            concept: '#10b981',  // Grønn
            dataset: '#8b5cf6',  // Lilla
            default: '#9ca3af'   // Grå
        };

        // Enkel regex-basert YAML frontmatter parser for klientside-bruk
        function parseOKFContent(rawText) {
            const frontmatterRegex = /^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/;
            const match = rawText.match(frontmatterRegex);
            
            if (!match) return { metadata: {}, body: rawText };

            const yamlLines = match[1].split('\n');
            const metadata = {};
            yamlLines.forEach(line => {
                const parts = line.split(':');
                if (parts.length >= 2) {
                    const key = parts[0].trim();
                    const value = parts.slice(1).join(':').trim().replace(/^["']|["']$/g, '');
                    
                    // Håndter enkle arrays som f.eks [tag1, tag2]
                    if (value.startsWith('[') && value.endsWith(']')) {
                        metadata[key] = value.slice(1, -1).split(',').map(s => s.trim());
                    } else {
                        metadata[key] = value;
                    }
                }
            });

            return { metadata, body: match[2] };
        }

        // Funksjon som skanner markdown-tokens for å finne lenker (edges)
        function extractLinks(bodyText) {
            const tokens = md.parse(bodyText, {});
            const foundLinks = [];
            
            tokens.forEach(token => {
                if (token.type === 'inline' && token.children) {
                    token.children.forEach(child => {
                        if (child.type === 'link_open') {
                            const href = child.attrs.find(attr => attr[0] === 'href');
                            if (href && !href[1].startsWith('http') && !href[1].startsWith('#')) {
                                foundLinks.push(href[1]);
                            }
                        }
                    });
                }
            });
            return foundLinks;
        }

        // Hovedfunksjon for å laste en node samt oppdatere grafen
        async function loadNode(filePath) {
            document.getElementById('current-path').innerText = filePath;
            
            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error(`Fant ikke filen: ${filePath}`);
                
                const rawText = await response.text();
                const { metadata, body } = parseOKFContent(rawText);

                // 1. Rendrer dokumentet (Høyre panel)
                let metaHTML = '<div class="meta-section">';
                if(metadata.type) metaHTML += `<span class="meta-badge type">Type: ${metadata.type}</span>`;
                if(metadata.status) metaHTML += `<span class="meta-badge status">Status: ${metadata.status}</span>`;
                if(metadata.trust_tier) metaHTML += `<span class="meta-badge tier">Tier: ${metadata.trust_tier}</span>`;
                metaHTML += '</div>';
                if(metadata.owner) metaHTML += `<small style="color:#6b7280">Eier: ${metadata.owner}</small>`;
                
                document.getElementById('metadata-target').innerHTML = metaHTML;
                document.getElementById('content-target').innerHTML = md.render(body);

                // 2. Graf-logikk: Legg til eller oppdater denne noden i Vis.js
                const nodeType = metadata.type || 'default';
                const nodeTitle = metadata.title || filePath.split('/').pop();
                
                if (!nodes.get(filePath)) {
                    nodes.add({
                        id: filePath,
                        label: nodeTitle,
                        color: typeColors[nodeType] || typeColors.default,
                        font: { color: '#ffffff', face: 'sans-serif' },
                        shape: 'box',
                        margin: 10
                    });
                }

                // Marker den nåværende aktive noden visuelt (tykkere kant)
                nodes.get().forEach(n => {
                    nodes.update({id: n.id, borderWidth: n.id === filePath ? 4 : 1, borderColor: '#1f2937'});
                });

                // 3. Finn relasjoner (både fra teksten og fra 'see_also' i frontmatter)
                let connectedFiles = extractLinks(body);
                if (Array.isArray(metadata.see_also)) {
                    connectedFiles = [...new Set([...connectedFiles, ...metadata.see_also])];
                }

                // Finn mappen vi står i for å løse relative stier korrekt
                const currentDir = filePath.substring(0, filePath.lastIndexOf('/'));

                connectedFiles.forEach(relPath => {
                    const absoluteUrl = new URL(relPath, window.location.href + (currentDir ? '/' + currentDir + '/' : '/'));
                    let cleanTarget = absoluteUrl.pathname.replace(window.location.pathname, '').replace(/^\//, '');
                    if(!cleanTarget) cleanTarget = 'index.md';

                    if (!nodes.get(cleanTarget)) {
                        nodes.add({
                            id: cleanTarget,
                            label: relPath.split('/').pop().replace('.md', ''),
                            color: typeColors.default,
                            shape: 'box',
                            margin: 10
                        });
                    }

                    const edgeId = `${filePath}->${cleanTarget}`;
                    const inverseEdgeId = `${cleanTarget}->${filePath}`;
                    if (!edges.get(edgeId) && !edges.get(inverseEdgeId)) {
                        edges.add({
                            id: edgeId,
                            from: filePath,
                            to: cleanTarget,
                            arrows: 'to',
                            color: { color: '#9ca3af', highlight: '#3b82f6' }
                        });
                    }
                });

                // Klikk-håndtering inni selve markdown-teksten
                document.querySelectorAll('#content-target a').forEach(link => {
                    const href = link.getAttribute('href');
                    if (href && !href.startsWith('http') && !href.startsWith('#')) {
                        link.addEventListener('click', (e) => {
                            e.preventDefault();
                            const absoluteUrl = new URL(href, window.location.href + (currentDir ? '/' + currentDir + '/' : '/'));
                            const cleanTarget = absoluteUrl.pathname.replace(window.location.pathname, '').replace(/^\//, '') || 'index.md';
                            window.history.pushState({ path: cleanTarget }, '', '#' + cleanTarget);
                            loadNode(cleanTarget);
                        });
                    }
                });

            } catch (error) {
                document.getElementById('content-target').innerHTML = `<p style="color:red;">Feil ved lasting av graf-node: ${error.message}</p>`;
            }
        }

        // 4. Initialiser Vis.js Network-containeren
        function initNetwork() {
            const container = document.getElementById('network-container');
            const data = { nodes: nodes, edges: edges };
            const options = {
                physics: {
                    barnesHut: { gravitationalConstant: -3000, centralGravity: 0.3, springLength: 95 }
                },
                interaction: { hover: true }
            };
            
            networkInstance = new vis.Network(container, data, options);

            networkInstance.on("click", function (params) {
                if (params.nodes.length > 0) {
                    const clickedNodeId = params.nodes[0];
                    window.history.pushState({ path: clickedNodeId }, '', '#' + clickedNodeId);
                    loadNode(clickedNodeId);
                }
            });
        }

        window.addEventListener('popstate', () => {
            const targetFile = window.location.hash.replace('#', '') || 'index.md';
            loadNode(targetFile);
        });

        // Start appen
        initNetwork();
        const initialFile = window.location.hash.replace('#', '') || 'index.md';
        loadNode(initialFile);
    </script>
</body>
</html>
